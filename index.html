<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#234331">
<meta name="description" content="Einkauf: deine gemeinsame, praktische Einkaufsliste im Bento-Design.">

<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./styles.css">
<title>Einkauf · Gemeinsam einkaufen</title>
</head>
<body>
<div id="app">
  <header class="app-header"><img src="./icon-192.png" alt="Einkauf" class="app-logo"><button id="settingsBtn" class="settings-white" aria-label="Einstellungen und Backup"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m9 3-.6 2.2-2 .9-2-.7-2 3.4 1.6 1.6v2.3L2.4 14l2 3.4 2.1-.6 2 .9L9 20h4l.6-2.3 2-.9 2.1.6 2-3.4-1.6-1.3v-2.3L19.7 9l-2-3.5-2.1.6-2-.9L13 3Z"/><circle cx="11" cy="11.5" r="3.2"/></svg></button></header>
  <main class="bento-main"><div class="new-list-row"><button id="newListBtn" class="new-list-button">+ Neue Liste</button></div><section id="listCards" aria-label="Deine Einkaufslisten"></section><footer><span id="saveStatus">Lokal gespeichert</span></footer></main>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<div class="overlay" id="overlay" hidden><div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-header"><h2 id="modalTitle"></h2><button class="close-modal" id="closeModal" aria-label="Schließen">×</button></div><div id="modalBody"></div></div></div>
<input type="file" id="scanFile" accept="image/*" capture="environment" hidden>
<input type="file" id="backupFile" accept="application/json,.json" hidden>
<script defer src="./qr.js"></script>
<script defer src="./firebase-config.js"></script>
<script defer src="./app.js"></script>
</body>
</html>
